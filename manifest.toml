# 配布の目録(仕様書「仕組みの正本と配布」)
#
# vault ごとに、配布物を何から組み立てるかと、ファイルの扱いを決める。
#   system: 仕組みのファイル。版を当てるたびに上書きする
#   seed:   最初だけのファイル。なければ置く。あれば触らない
# どちらにも当てはまらないファイルがあると、tools/build.py は止まる。
# パターンは vault の一番上からのパス。* は / をまたいで当てはまる。

[[vault]]
name = "共有"
src = "vault/共有"
include = [
  { from = "docs/00_仕様書.md", to = "00_仕様書.md" },
  { from = "docs/00_同期プログラム要件.md", to = "00_同期プログラム要件.md" },
  { from = "docs/00_現場向け1枚.md", to = "00_現場向け1枚.md" },
]
system = [
  "00_README.md",
  "00_仕様書.md",
  "00_同期プログラム要件.md",
  "00_現場向け1枚.md",
  "00_*.base",
  "_templates/*",
  "_設定/*",
]
seed = [
  "00_同期設定.yaml",
  "_tools/同期プログラム/メンバー.csv",
]

[[vault]]
name = "個人"
src = "vault/個人"
include = [
  { from = "vault/共有/_templates", to = "_templates" },
  { from = "vault/共有/00_イシュー一覧.base", to = "00_イシュー一覧.base" },
  { from = "vault/共有/00_タスク一覧.base", to = "00_タスク一覧.base" },
]
system = [
  "00_README.md",
  "00_*.base",
  "_templates/*",
]
seed = [
  "00_同期レポート.md",
  "_記録/私.yaml",
  ".obsidian/*",
]

[[vault]]
name = "機密"
src = "vault/機密"
include = [
  { from = "vault/共有/_templates/図.excalidraw.md", to = "_templates/図.excalidraw.md" },
  { from = "vault/共有/_templates/_scripts", to = "_templates/_scripts" },
  { from = "vault/共有/_templates/_コマンド", to = "_templates/_コマンド" },
  { from = "vault/共有/_tools/同期プログラム/メンバー.csv", to = "_tools/メンバー.csv" },
]
system = [
  "_templates/*",
  "_設定/*",
]
seed = [
  "00_README.md",
  "_tools/メンバー.csv",
]
