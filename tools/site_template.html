<style>

<header><div class="bar"><button id="back" class="back" type="button" onclick="goBack()" aria-label="1つ前の画面に戻る" disabled>← 戻る</button><a class="brand" href="#home">開発ノート閲覧</a><nav><a href="#home">案件</a><a href="#week">今週の更新</a><!--NAV--></nav><span class="who">閲覧者 {{USER}}</span></div></header>
<main id="view"></main>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mbox"><h2 id="mt">確認</h2><div class="mbody"></div><div class="gbtns"><button class="ok mok" type="button">許可する</button><button class="mcancel" type="button">やめる</button></div></div></div>
<footer>生成 {{BUILT}} ・ 閲覧権限のあるノートだけを表示しています</footer>
<script>
const PAGES=/*PAGES*/;const ASSETS=/*ASSETS*/;const MYTAGS=/*MYTAGS*/;const TAGS=/*TAGS*/;const USERS=/*USERS*/;const HOL=new Set(/*HOL*/);
// 画面遷移：#n-ID.F02 はノートを開いてフレームまで移動。戻るは独自の履歴で管理（どのタブでも共通）
const HIST=[];let CUR=null,BACKING=false;
function show(){const raw=(location.hash||'#home').slice(1);const [k,fr]=raw.split('.');const v=document.getElementById('view');
  if(CUR&&CUR!==raw&&!BACKING)HIST.push(CUR);BACKING=false;CUR=raw;
  v.innerHTML=PAGES[k]||'<h1>見つかりません</h1><p class="lead">このページは存在しないか、閲覧権限がありません。<a href="#home">案件一覧へ</a></p>';
  v.querySelectorAll('x-a').forEach(e=>{e.outerHTML=ASSETS[e.getAttribute('k')]||'';});
  const tgt=fr&&document.getElementById('fr-'+fr);if(tgt){tgt.scrollIntoView();tgt.classList.add('hl');}else window.scrollTo(0,0);
  document.getElementById('back').disabled=!HIST.length;if(window.initEditor)initEditor();}
function goBack(){if(!HIST.length)return;BACKING=true;location.hash=HIST.pop();}
addEventListener('hashchange',show);
// 開示申請：確認ポップアップ → 許可（試作では、結果をチャットに貼って反映する）
const M=document.getElementById('modal');
// 見られるタグの選択：元の鍵（全部そろった人が見られる）と開示先タグ。自分が見られなくなる変更はできない
const MY=new Set(MYTAGS);
function itemsOf(els){return els.map(c=>({base:JSON.parse(c.dataset.base||'[]'),aud:JSON.parse(c.dataset.aud||'[]')}));}
function canSee(it,baseOn,auds){return (baseOn&&it.base.length&&it.base.every(t=>MY.has(t)))||auds.some(t=>MY.has(t));}
function renderTags(box,items){box.items=items;if(!items.length){box.innerHTML='<p class="sub">資料を選ぶと表示されます</p>';return;}
  const baseKey=JSON.stringify(items[0].base);const sameBase=items.every(i=>JSON.stringify(i.base)===baseKey);
  let html='';
  if(sameBase&&items[0].base.length)html+=`<label class="tgx"><input type="checkbox" class="tb" checked> ${items[0].base.join(' ＋ ')}<span class="sub">（元の鍵）</span></label>`;
  for(const t of TAGS){if(sameBase&&items[0].base.includes(t))continue;const n=items.filter(i=>i.aud.includes(t)).length;
    html+=`<label class="tgx"><input type="checkbox" class="ta" value="${t}" ${n===items.length?'checked':''} data-mixed="${n>0&&n<items.length?1:0}"> ${t}${n>0&&n<items.length?'<span class="sub">（一部のみ）</span>':''}</label>`;}
  box.innerHTML=html+'<p class="sub tmsg"></p>';guard(box);}
function stateOf(box){const tb=box.querySelector('.tb');const add=[...box.querySelectorAll('.ta:checked')].map(c=>c.value);
  const rem=[...box.querySelectorAll('.ta:not(:checked)')].filter(c=>c.dataset.mixed==='1'||box.items.some(i=>i.aud.includes(c.value))).map(c=>c.value);
  return {baseOn:tb?tb.checked:true,add,rem};}
function after(it,st){const a=new Set(it.aud);st.add.forEach(t=>a.add(t));st.rem.forEach(t=>a.delete(t));return [...a];}
function guard(box){const st=stateOf(box);box.querySelectorAll('.tb,.ta').forEach(cb=>{if(!cb.checked){cb.disabled=false;return;}
    cb.checked=false;const s2=stateOf(box);cb.checked=true;const ok=box.items.every(i=>canSee(i,s2.baseOn,after(i,s2)));cb.disabled=!ok;
    cb.closest('label').title=ok?'':'外すとあなたが見られなくなります';cb.closest('label').classList.toggle('lockx',!ok);});
  const m=box.querySelector('.tmsg');if(m)m.textContent=[...box.querySelectorAll('.tb:disabled,.ta:disabled')].length?'灰色の項目は、外すとあなた自身が見られなくなるため外せません。':'';}
function summary(it,st){return (st.baseOn?it.base.join(' ＋ '):'')+(after(it,st).length?(st.baseOn?' ／ ':'')+'公開 '+after(it,st).join(' / '):'');}
function sel(sec){return [...sec.querySelectorAll('.gt:checked,.sn:checked')];}
function aud(sec){const a=sec.querySelector('input[name=aud]:checked');return a?a.value:'';}
function checks(sec){return [...sec.querySelectorAll('.ck:checked')].map(c=>c.value);}
function why(sec){const c=checks(sec),r=sec.querySelector('textarea').value.trim();return [c.length?'確認項目：'+c.join('、'):'',r].filter(Boolean).join(' ／ ');}
function openModal(sec,act){const msg=sec.querySelector('.gmsg');const reason=why(sec);const it=sel(sec);
  if(!reason){msg.textContent='確認項目にチェックするか、コメント（判断の理由）を入力してください。';sec.querySelector('textarea').focus();return;}
  if(act!=='reject'&&!it.length){msg.textContent='公開する資料を1件以上選んでください。';return;}
  M.querySelector('h2').textContent=act==='reject'?'却下の確認':act==='scope'?'見せる相手の変更':'社内公開の確認';
  if(act==='scope'){const box=sec.querySelector('.tagbox');const st=stateOf(box);if(!st.add.length&&!st.rem.length&&st.baseOn){msg.textContent='見られるタグが変わっていません。';return;}
    it.forEach((c,k)=>{const i=box.items[k];c.dataset.after=summary(i,st);});M.st=st;}
  M.querySelector('.mbody').innerHTML=(act!=='reject'?(act==='scope'?'<p>次の資料の見せる相手を変更します。</p>':'<p>次の資料を社内に公開します。</p>')+'<ul>'+it.map(c=>`<li><b>${c.dataset.label}</b>${c.dataset.before?`<br><span class="b4x">${c.dataset.before}</span> → <span class="af">${c.dataset.after}</span>`:''}</li>`).join('')+'</ul>':'<p>この申請を却下します。</p>')
    +`<p class="mreason">理由：${reason.replace(/</g,'&lt;')}</p>`;
  M.querySelector('.mok').textContent=act==='reject'?'却下する':act==='scope'?'変更する':'公開する';M.dataset.act=act;M.sec=sec;M.hidden=false;M.querySelector('.mok').focus();}

function openScope(b){M.querySelector('h2').textContent='見せる相手の変更';M.dataset.act='single';M.btn=b;
  M.querySelector('.mbody').innerHTML=`<p><b>${b.dataset.sl}</b><br><span class="sub">文書ID ${b.dataset.st}</span></p><p class="rl">見せる相手</p><div class="tagbox"></div>
   <p class="rl">確認項目</p><label class="chk"><input type="checkbox" class="sck" value="顧客情報なし"> 顧客情報なし</label>
   <label class="rl" for="sr">コメント（確認項目にチェックがない場合は必須）</label><textarea id="sr" rows="2"></textarea><p class="smsg" aria-live="polite"></p><pre class="gout" hidden></pre>`;

function doScope(){const b=M.btn,body=M.querySelector('.mbody');const box=body.querySelector('.tagbox');const st=stateOf(box);
  if(!st.add.length&&!st.rem.length&&st.baseOn){body.querySelector('.smsg').textContent='見られるタグが変わっていません。';return;}
  const c=[...body.querySelectorAll('.sck:checked')].map(x=>x.value),r=body.querySelector('#sr').value.trim();
  const why=[c.length?'確認項目：'+c.join('、'):'',r].filter(Boolean).join(' ／ ');
  if(!why){body.querySelector('.smsg').textContent='確認項目にチェックするか、コメントを入力してください。';return;}
  const it=box.items[0];const out=body.querySelector('.gout');
  out.textContent=`見せる相手の変更\n対象: ${b.dataset.st}\n変更前: ${summary(it,{baseOn:true,add:[],rem:[]})}\n変更後: ${summary(it,st)}\n付ける: ${st.add.filter(t=>!it.aud.includes(t)).join(', ')||'—'}\n外す: ${st.rem.join(', ')||'—'}${st.baseOn?'':'\n元の鍵を外す: はい'}\n理由: ${why}`;out.hidden=false;
  body.querySelector('.smsg').innerHTML='記録しました（反映待ち）。試作では、この内容をチャットに貼ると反映されます。<button class="copy" type="button">コピー</button>';
  M.querySelector('.mok').hidden=true;M.querySelector('.mcancel').textContent='閉じる';b.classList.add('pending');}

    M.querySelector('.mok').hidden=true;M.querySelector('.mcancel').textContent='閉じる';M.hidden=false;M.querySelector('.mcancel').focus();return;}

  if(e.target.closest('.mok')){const sec=M.sec,act=M.dataset.act;M.hidden=true;const reason=why(sec);const it=sel(sec);
    const out=sec.querySelector('.gout');const txt=act==='scope'?`見せる相手の変更\n対象: ${it.map(c=>c.value).join(', ')}\n付ける: ${M.st.add.join(', ')||'—'}\n外す: ${M.st.rem.join(', ')||'—'}${M.st.baseOn?'':'\n元の鍵を外す: はい'}\n理由: ${reason}`:`公開の判断 ${sec.dataset.gid}\n判断: ${act==='approve'?'公開':'却下'}\n対象: ${act==='approve'?it.map(c=>c.value).join(', '):'—'}\n理由: ${reason}`;
    out.textContent=txt;out.hidden=false;const st=sec.querySelector('.gstate');if(st)st.textContent='状態：'+(act==='reject'?'却下（反映待ち）':'許可（反映待ち）');
    sec.querySelector('.gmsg').innerHTML='判断を記録しました。試作では、下の内容をチャットに貼ると反映されます。<button class="copy" type="button">コピー</button>';}
  const cp=e.target.closest('button.copy'); if(cp){const t=(cp.closest('section')||cp.closest('.mbox')).querySelector('.gout');try{await navigator.clipboard.writeText(t.textContent);cp.textContent='コピーしました';}catch(_){const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent='選択しました。長押しでコピー';}}
});

let RVIMG=[];
function openReview(pre){const main=document.querySelector('#view .rvmain');if(!main)return;const opts=JSON.parse(main.dataset.rv);
  M.querySelector('h2').textContent='コメント';M.dataset.act='review';RVIMG=[];

  M.querySelector('.mbody').innerHTML=`<div class="rvf"><label class="rl" for="rvt">対象</label><select id="rvt">${opts.map(o=>`<option value="${o.t}" ${o.t===pre?'selected':''}>${o.l.replace(/</g,'&lt;')}</option>`).join('')}</select>
   <label class="rl" for="rvx">内容（必須）</label><textarea id="rvx" rows="3" placeholder="例：図2の荷重条件が不明。根拠を追記してほしい"></textarea>
   <label class="chk" style="display:block;margin-top:12px"><input type="checkbox" id="rvk"> やることにする（担当・期限を付けて相手に届ける）</label>

function addImgs(files){[...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{const r=new FileReader();r.onload=()=>{RVIMG.push({name:f.name||'貼り付け画像.png',url:r.result});drawThumbs();};r.readAsDataURL(f);});}
function drawThumbs(){const t=M.querySelector('.thumbs');if(!t)return;t.innerHTML=RVIMG.map((im,i)=>`<div><img src="${im.url}" alt="${im.name.replace(/"/g,'')}"><button type="button" class="rvdel" data-i="${i}" aria-label="外す">×</button></div>`).join('');}

// ---------- 工程：表示切替・タスクの経過・ドラッグで日程調整・画像保存 ----------
const DAY=864e5;const iso=d=>d.toISOString().slice(0,10);const pd=s=>new Date(s+'T00:00:00Z');const md=s=>{const d=pd(s);return (d.getUTCMonth()+1)+'/'+d.getUTCDate();};
const isWork=d=>{const w=d.getUTCDay();return w>0&&w<6&&!HOL.has(iso(d));};
function wdays(a,b){a=pd(a);b=pd(b);if(+a===+b)return 0;const sg=b>a?1:-1;let n=0;for(let d=new Date(Math.min(a,b)+DAY);d<=new Date(Math.max(a,b));d=new Date(+d+DAY))if(isWork(d))n++;return sg*n;}
function wrapOf(el){return el.closest('.gantt-wrap')||document.querySelector('#view .gantt-wrap');}

  M.querySelector('h2').textContent=(T.milestone?'◆ ':'')+T.name;M.dataset.act='info';
  M.querySelector('.mbody').innerHTML=`<p class="sub mono">${T.id}</p><dl class="tinfo"><dt>状態</dt><dd>${T.state||'—'}${T.delay>0?` <span class="late">当初比 +${T.delay}日</span>`:''}</dd>
   <dt>当初計画</dt><dd>${T.base}</dd><dt>今の計画</dt><dd>${T.plan}</dd><dt>実績</dt><dd>${T.act}</dd><dt>見込み</dt><dd>${T.fc}</dd>
   ${T.milestone?'':`<dt>やること</dt><dd>${T.cnt}（完了／総数）</dd><dt>担当</dt><dd>${T.owner}</dd>`}</dl>
   ${T.req?`<div class="impact" style="margin-top:10px"><b style="color:var(--wait)">申請中の計画変更</b>（${T.req.by}）<br>${T.req.code}：${T.req.reason}<ul class="ttl">${T.req.ch.map(c=>`<li>${c}</li>`).join('')}</ul>承認が要る理由：${T.req.why||'—'}${wrap.dataset.mgr==='1'?'<br><a href="#grants">確認待ちで判断する →</a>':''}</div>`:''}
   <p class="rl">週報</p>${li(T.weekly,w=>`<li><b>${w.w}</b> ${w.cnt?'やること '+w.cnt:''} ${w.fc?'・見込み '+w.fc:''} ${w.act?'・'+w.act:''}<br>${w.did}${w.issue?`<br><span style="color:var(--wait)">課題：${w.issue}</span>`:''} <span class="sub">${w.who}</span></li>`)}
   ${T.milestone||T.group?'':'<p class="rl">やること</p>'+li(T.todos,t=>`<li class="${t[0]?'tdone':''}">${t[0]?'☑':'☐'} ${t[1]}</li>`)}

  M.querySelector('.mok').hidden=true;M.querySelector('.mcancel').textContent='閉じる';M.hidden=false;}

},true);
function svgPt(svg,ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
// 棒の中ほどをつかむ＝ずらす、端（左右10px）をつかむ＝開始日・終了日だけ動かす（長さが変わる）
function edgeOf(el,svg,ev){if(!el||!el.classList.contains('plan'))return 'move';const x=svgPt(svg,ev).x,x1=+el.getAttribute('x'),w=+el.getAttribute('width');const z=Math.min(10,w/3);
  return x<x1+z?'start':x>x1+w-z?'end':'move';}
document.addEventListener('pointermove',e=>{if(DRAG)return;const el=e.target.closest('.editing svg.gantt rect.plan');if(!el)return;const m=edgeOf(el,el.closest('svg'),e);el.style.cursor=m==='move'?'grab':'col-resize';});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.editing svg.gantt [data-task]');if(!el)return;const svg=el.closest('svg');const geo=JSON.parse(svg.dataset.geo);
  const tid=el.dataset.task;const T=JSON.parse(wrapOf(svg).dataset.tasks)[tid];if(!T||T.group)return;
  const plan=svg.querySelector(`rect.plan[data-task="${tid}"]`);const mode=T.milestone?'move':edgeOf(plan,svg,e);
  e.preventDefault();DRAG={svg,geo,tid,T,mode,plan,x0:svgPt(svg,e).x,px:plan?+plan.getAttribute('x'):0,pw:plan?+plan.getAttribute('width'):0,
    els:[...svg.querySelectorAll(`rect[data-task="${tid}"]:not(.hit),path[data-task="${tid}"]`)],dd:0};});
document.addEventListener('pointermove',e=>{if(!DRAG)return;const g=DRAG.geo;const ppd=(g.x1-g.x0)/((pd(g.e)-pd(g.s))/DAY);const snap=g.view==='m1'?1:7;
  let dd=Math.round((svgPt(DRAG.svg,e).x-DRAG.x0)/ppd/snap)*snap;const len=Math.round(DRAG.pw/ppd);
  if(DRAG.mode==='start')dd=Math.min(dd,len-1);if(DRAG.mode==='end')dd=Math.max(dd,1-len);if(dd===DRAG.dd)return;DRAG.dd=dd;
  if(DRAG.mode==='move')DRAG.els.forEach(el=>el.setAttribute('transform',`translate(${dd*ppd},0)`));
  else if(DRAG.mode==='start'){DRAG.plan.setAttribute('x',DRAG.px+dd*ppd);DRAG.plan.setAttribute('width',DRAG.pw-dd*ppd);}
  else DRAG.plan.setAttribute('width',DRAG.pw+dd*ppd);});
function undrag(D){D.els.forEach(el=>el.removeAttribute('transform'));if(D.plan){D.plan.setAttribute('x',D.px);D.plan.setAttribute('width',D.pw);}}
document.addEventListener('pointerup',e=>{if(!DRAG)return;const D=DRAG;DRAG=null;if(!D.dd){undrag(D);return;}
  D.ds=D.mode==='end'?0:D.dd;D.de=D.mode==='start'?0:D.dd;planRequest(D);});
function planRequest(D){const T=D.T;const sh=(s,k)=>iso(new Date(+pd(s)+k*DAY));
  // 休日に落ちたら、開始・節目は次の稼働日、終了は前の稼働日へ寄せる
  const fwd=x=>{let d=pd(x);while(!isWork(d))d=new Date(+d+DAY);return iso(d);},back=x=>{let d=pd(x);while(!isWork(d))d=new Date(+d-DAY);return iso(d);};
  const ns=fwd(sh(T.s,D.ds)),ne=T.milestone?ns:back(sh(T.e,D.de));D.ns=ns;D.ne=ne;const late=wdays(T.e,ne);const need=T.milestone||late>5;const dd=D.dd;
  M.querySelector('h2').textContent='計画変更の申請';M.dataset.act='plan-req';M.D=D;
  M.querySelector('.mbody').innerHTML=`<p><b>${T.name}</b></p><p><span class="b4x">${T.milestone?md(T.s):md(T.s)+'〜'+md(T.e)}</span> → <span class="af">${T.milestone?md(ns):md(ns)+'〜'+md(ne)}</span>（${D.mode==='move'?'ずらす':D.mode==='start'?'開始を':'終了を'} ${dd>0?'+':''}${dd}日）</p>
   <p class="${need?'late':'sub'}">${need?'上司の承認が必要（'+(T.milestone?'節目の移動':'実働'+late+'日の遅れ')+'）':'承認は不要（実働5日以内）。記録だけ残ります'}</p>
   <label class="chk"><input type="checkbox" id="pshift" checked> 後ろにつながるタスクも一緒にずらす</label>
   <label class="rl" for="pcode">理由の区分（必須）</label><select id="pcode"><option value="">選んでください</option>${['見積の誤り','仕様変更','外部待ち（部品・外注・顧客）','不具合・やり直し','人の都合（他案件・休み）','その他'].map(x=>`<option>${x}</option>`).join('')}</select>
   <label class="rl" for="pwhy">理由（必須）</label><textarea id="pwhy" rows="2"></textarea><p class="smsg" aria-live="polite"></p><pre class="gout" hidden></pre>`;
  M.querySelector('.mok').hidden=false;M.querySelector('.mok').textContent=need?'承認を依頼する':'変更を記録する';M.querySelector('.mcancel').textContent='やめる';M.hidden=false;}
document.addEventListener('click',e=>{if(!(e.target.closest('.mok')&&M.dataset.act==='plan-req'))return;e.stopImmediatePropagation();
  const b=M.querySelector('.mbody'),D=M.D,T=D.T;const code=b.querySelector('#pcode').value,why=b.querySelector('#pwhy').value.trim();
  if(!code||!why){b.querySelector('.smsg').textContent='理由の区分と理由を入れてください。';return;}
  const sh=(s,k)=>iso(new Date(+pd(s)+k*DAY));const sid=wrapOf(D.svg).dataset.sid;
  const out=b.querySelector('.gout');out.textContent=`計画変更の申請\n工程表: ${sid}\n対象: ${T.id.split('#')[1]} ${T.name}\n変更後: ${T.milestone?D.ns:D.ns+' 〜 '+D.ne}\n後ろも一緒にずらす: ${b.querySelector('#pshift').checked?'はい':'いいえ'}\n区分: ${code}\n理由: ${why}`;out.hidden=false;
  b.querySelector('.smsg').innerHTML='申請を作りました（反映待ち）。試作では、この内容をチャットに貼ると反映されます。<button class="copy" type="button">コピー</button>';
  M.querySelector('.mok').hidden=true;M.querySelector('.mcancel').textContent='閉じる';},true);
document.addEventListener('click',e=>{if(e.target.closest('.mcancel')&&M.D){undrag(M.D);M.D=null;}},true);
function planDecide(btn){const sec=btn.closest('section');const c=sec.querySelector('textarea').value.trim();const msg=sec.querySelector('.gmsg');
  if(!c){msg.textContent='コメントを入れてください。';sec.querySelector('textarea').focus();return;}
  const ok=btn.dataset.act==='plan-ok';const out=sec.querySelector('.gout');out.textContent=`計画変更の判断 ${sec.dataset.gid}\n判断: ${ok?'承認':'却下'}\nコメント: ${c}`;out.hidden=false;
  msg.innerHTML='判断を記録しました。試作では、この内容をチャットに貼ると反映されます。<button class="copy" type="button">コピー</button>';}
function saveImg(w,withReq){const v=[...w.querySelectorAll('.gview')].find(x=>!x.hidden);const svg=v.querySelector('svg').cloneNode(true);
  svg.querySelectorAll('.hit').forEach(x=>x.remove());if(!withReq)svg.querySelectorAll('.req').forEach(x=>x.remove());
  const vb=svg.getAttribute('viewBox').split(' ').map(Number);const hgt=vb[3];svg.removeAttribute('data-geo');svg.setAttribute('width','1188');svg.setAttribute('height',String(hgt));
  const src=new XMLSerializer().serializeToString(svg);const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=2376;c.height=hgt*2;const x=c.getContext('2d');x.drawImage(img,0,0,2376,hgt*2);
    let png='';try{png=c.toDataURL('image/png');}catch(_){}
    const tab=w.querySelector('.gtab.on');const name=`${w.dataset.name||'工程表'}_${tab?tab.textContent:''}_${new Date().toISOString().slice(0,10).replace(/-/g,'')}`;
    M.querySelector('h2').textContent='画像を保存（書き込みなし）';M.dataset.act='info';M.W=w;
    M.querySelector('.mbody').innerHTML=`<div class="savebox"><label><input type="checkbox" class="sreq" ${withReq?'checked':''}> 申請中（未承認）の計画も入れる</label></div><p class="sub">パワポに貼る用。下の画像を長押し（PCは右クリック）して「コピー」「画像を保存」。</p><img src="${png||url}" alt="ガント図" style="max-width:100%;border:1px solid var(--line)">
`;
    M.querySelector('.mok').hidden=true;M.querySelector('.mcancel').textContent='閉じる';M.hidden=false;};img.src=url;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')M.hidden=true;});
/*EDITOR_JS*/
show();
</script>
