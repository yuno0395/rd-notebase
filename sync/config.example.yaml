# 置き場所: %APPDATA%\知見同期\config.yaml
# 場所は、PC 上で同期されるフォルダ(共有クラウドフォルダ: Box Drive・OneDrive・Google ドライブ・社内 NAS など)の中に書く。
# 例: C:\Users\<名前>\Box、C:\Users\<名前>\OneDrive - 会社名、\\nas\開発
member: Yu                       # メンバー.csv の名前
personal: <共有クラウドフォルダ>\個人\開発ノート_Yu
shared: <共有クラウドフォルダ>\チーム\開発ノート_共有
shared_data: <共有クラウドフォルダ>\チーム\開発データ     # 重い添付の置き場所(F-17〜20)
report: <共有クラウドフォルダ>\チーム\開発ノート_報告      # 管理者向けの週報(F-29。書いた PC なら誰でも月曜に作る)
secret:                          # 機密フォルダ(いくつでも、名前は自由)
  - <共有クラウドフォルダ>\機密\顧客A
dry_run: true                    # 最初は試し運転(レポートだけ書く)
idle_seconds: 10                 # 最後の編集からこの秒数たつまで触らない
# backup_dir: 省略時は config.yaml と同じ場所の backup\
# state_dir: 前回同期の記録の置き場所。省略時は個人 vault の _仕組み/記録/(複数の PC で同じ記録を使う)
