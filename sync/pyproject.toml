[project]
name = "notesync"
version = "0.1.0"
description = "開発ノートの同期プログラム(id つけ・リンク直し・同期レポート)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
notesync = "notesync.__main__:main"

[tool.setuptools]
packages = ["notesync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
