# 利用者の PC で動く部分（client/）の実行環境。notebase.cmd が uv で用意する
# 自分の vault の Web閲覧・PDF（tools/ の部品を手元で使う）にも Markdown・reportlab・Pillow が要る
[project]
name = "rd-notebase"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "Markdown>=3.4", "reportlab>=4", "Pillow>=10"]

[tool.uv]
package = false
