<rect x="300.0" y="70.0" width="114.0" height="40.0" rx="10" fill="#ffffff" stroke="#8f97a3" stroke-width="1.3"/>
<text x="357.0" y="91.0" font-size="15" fill="#1d2430" text-anchor="middle" font-weight="normal" dominant-baseline="middle">電池ユニット</text>
