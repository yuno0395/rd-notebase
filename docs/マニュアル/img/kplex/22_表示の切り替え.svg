<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="'Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif" role="img" aria-label="Compass と Mind Map の切り替え">
<title>Compass と Mind Map の切り替え</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="299" rx="14" fill="#ffffff" stroke="#d6dae1"/>
<circle cx="30" cy="30" r="12" fill="#2f6fde"/>
<text x="30.0" y="30.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">1</text>
<text x="50.0" y="30.0" font-size="15" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">ツールバーの漏斗(Views and lenses)を押す</text>
<rect x="30.0" y="56.0" width="300.0" height="44.0" rx="10" fill="#f4f5f7" stroke="#d6dae1" stroke-width="1.2"/>
<rect x="200.0" y="63.0" width="34.0" height="30.0" rx="6" fill="#e7efff" stroke="#2f6fde" stroke-width="2"/>
<text x="217.0" y="78.0" font-size="15" fill="#2f6fde" text-anchor="middle" font-weight="bold" dominant-baseline="middle">⧩</text>
<rect x="160.0" y="110.0" width="230.0" height="150.0" rx="8" fill="#ffffff" stroke="#8f97a3" stroke-width="1.2"/>
<text x="176.0" y="132.0" font-size="13" fill="#5b6472" text-anchor="start" font-weight="normal" dominant-baseline="middle">Views</text>
<text x="176.0" y="162.0" font-size="14" fill="#1d2430" text-anchor="start" font-weight="normal" dominant-baseline="middle">● Compass(ふだん)</text>
<rect x="168.0" y="178.0" width="214.0" height="30.0" rx="5" fill="#e7efff" stroke="none" stroke-width="1.2"/>
<text x="176.0" y="193.0" font-size="14" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">○ Mind Map(多段)</text>
<text x="176.0" y="224.0" font-size="14" fill="#5b6472" text-anchor="start" font-weight="normal" dominant-baseline="middle">○ Facets(使わない)</text>
<line x1="400.0" y1="190.0" x2="450.0" y2="190.0" stroke="#2f6fde" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="480" cy="30" r="12" fill="#2f6fde"/>
<text x="480.0" y="30.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">2</text>
<text x="500.0" y="30.0" font-size="15" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">開きたいカードの ＋ を押す / 右クリック</text>
<rect x="470.0" y="56.0" width="470.0" height="210.0" rx="10" fill="#fbfbfc" stroke="#d6dae1" stroke-width="1.2"/>
<text x="486.0" y="84.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">＋ / −(カードの右の丸)</text>
<text x="486.0" y="101.0" font-size="12" fill="#5b6472" text-anchor="start" font-weight="normal" dominant-baseline="middle">その枝を1段開く・閉じる</text>
<text x="486.0" y="122.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">右クリック → Expand branch</text>
<text x="486.0" y="139.0" font-size="12" fill="#5b6472" text-anchor="start" font-weight="normal" dominant-baseline="middle">同じ(Alt+Enter でも)</text>
<text x="486.0" y="160.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">Alt+. → Expand one generation</text>
<text x="486.0" y="177.0" font-size="12" fill="#5b6472" text-anchor="start" font-weight="normal" dominant-baseline="middle">見えている枝をまとめて1段開く</text>
<text x="486.0" y="198.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">右クリック → Use as map root</text>
<text x="486.0" y="215.0" font-size="12" fill="#5b6472" text-anchor="start" font-weight="normal" dominant-baseline="middle">そのカードを根にして描き直す</text>
<text x="486.0" y="236.0" font-size="13" fill="#1d2430" text-anchor="start" font-weight="bold" dominant-baseline="middle">Alt+. → Collapse one generation</text>
<text x="486.0" y="253.0" font-size="12" fill="#5b6472" text-anchor="start" font-weight="normal" dominant-baseline="middle">いちばん深い段を閉じる</text>
</svg>
