# チーム設定(全員が同じものを使う。要件書「設定ファイル」)
id_epoch: 2026-01-01T00:00:00+09:00   # id の時刻の起点
keep_in_vault:
  images: [png, jpg, jpeg, gif, webp, svg]
  pdf: true
  video: [mp4, webm, mov]
  video_max_mb: 20
report_sections:             # 週報に載せる節。false で外す(Yu 2026-10-29)
  今週のトピック: true       # 台帳に選んだノートと手書きのダイジェスト
  開発の目処: true           # 成果物候補ごとの、方針リスクの解決数と未解決数
  候補の数: true
  マイルストーン: true
  中途半端な仕事: true       # priority 3・4 なのに一部だけ進めたイシュー
  担当者: true
  出荷準備度: false          # 開発の後の方で true にする
  同じノード: false          # プロジェクトが2つ以上になったら 自動 にする
